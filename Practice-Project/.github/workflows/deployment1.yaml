name: Deployment Exercise 1
on: push
jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build Code
        run: npm run build
      - name: Deploy
        run: echo "Deploying ..."

